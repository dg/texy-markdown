name: Tests

on: [push, pull_request]

jobs:
    tests:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                php: ['8.4', '8.5', '8.6']

            fail-fast: false

        name: PHP ${{ matrix.php }} tests
        steps:
            # texy/texy 4.0 is not released yet, so composer.json resolves it through a
            # path repository at ../_texy; the two checkouts recreate that layout here.
            - uses: actions/checkout@v7
              with:
                  path: markdown
            - uses: actions/checkout@v7
              with:
                  repository: dg/texy
                  path: _texy

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: mbstring
                  coverage: none

            - run: composer install --no-progress --prefer-dist
              working-directory: markdown
            - run: composer tester
              working-directory: markdown
            - if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: output-${{ matrix.php }}
                  path: markdown/tests/**/output
